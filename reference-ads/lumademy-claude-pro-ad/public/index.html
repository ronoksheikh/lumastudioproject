<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumademy × Claude Pro</title>
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
  <script src="/vendor/gsap/dist/gsap.min.js"></script>
  <script src="/vendor/gsap/dist/CustomEase.min.js"></script>
  <script src="/vendor/gsap/dist/DrawSVGPlugin.min.js"></script>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="scenes"></div>
      <div id="fx">
        <div class="vignette"></div>
        <div class="grain"></div>
        <div class="flash"></div>
      </div>
      <div id="captions"></div>
    </div>
  </div>

  <button id="start" type="button">
    <span class="play-ring"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
    <span class="start-label">Play the ad</span>
    <span class="start-hint">Space · play/pause &nbsp; R · restart &nbsp; ←/→ · seek &nbsp; C · captions &nbsp; F · fullscreen</span>
  </button>

  <div id="hud">
    <div class="bar"><div class="fill"></div></div>
    <div class="time">0.0s</div>
  </div>

  <audio id="vo" src="audio/voiceover.mp3" preload="auto"></audio>
  <script type="module" src="js/main.js"></script>
</body>
</html>
